# Local Supabase CLI config.
#
# NOTE: this project uses a hosted Supabase project (not `supabase start`).
# This file exists so CLI commands (`supabase db push`, `supabase link`,
# `supabase config push`) have a stable project identity.
#
# Workflow: `supabase config diff --project-ref <ref>` first (review changes),
# then `supabase config push --project-ref <ref> --yes`. Only declared settings
# are written; undeclared remote properties are left untouched.

project_id = "outwit"

[auth]
# Magic-link and OAuth callbacks land back on the app root; the client handles
# the `?code=` exchange via supabase-js `detectSessionInUrl`.
#
# Only declare settings we intentionally own. `supabase config push` will not
# touch properties this file omits (e.g. email confirmations), so remote
# defaults stay intact.
site_url = "https://outwit-one.vercel.app"
additional_redirect_urls = [
  "https://outwit-one.vercel.app",
  "https://outwit-one.vercel.app/**",
  "http://localhost:5173",
  "http://localhost:5173/**",
  "http://localhost:4173",
  "http://localhost:4173/**",
]

# Google OAuth (sign in with Google). The client id is public; the secret is
# read from the environment at push time so it never lands in the repo:
#   SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET=... supabase config push
# Google Cloud project: `outwit-auth` (authorized redirect URI:
# https://hqgamvpcowjjgxkchtzu.supabase.co/auth/v1/callback).
[auth.external.google]
enabled = true
client_id = "281761325025-1hmh045hd6ubhcgg751ehmip6eecinet.apps.googleusercontent.com"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false
